<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="api-key" content="{{ api_key }}">
    <title>YOLO 工作台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <div class="eyebrow">桌面端一体化流程</div>
        <h1>YOLO 工作台</h1>
        <p>一套流程，三个模块：数据标记、模型训练、模型推理。</p>
      </div>
    </header>

    <main class="cards">
      <a class="card" href="{{ url_for('annotation_page') }}">
        <span class="index">01</span>
        <h2>标记模块</h2>
        <p>创建数据集、上传图片、绘制标注框，并导出 YOLO 训练数据。</p>
      </a>
      <a class="card" href="{{ url_for('training_page') }}">
        <span class="index">02</span>
        <h2>训练模块</h2>
        <p>选择数据集和初始权重，配置轮数、批大小、设备并启动训练。</p>
      </a>
      <a class="card" href="{{ url_for('inference_page') }}">
        <span class="index">03</span>
        <h2>推理模块</h2>
        <p>上传图片或视频，选择权重文件，执行检测并查看输出结果。</p>
      </a>
    </main>
  </body>
</html>
