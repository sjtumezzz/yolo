<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Annotation Module</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='annotation.css') }}">
  </head>
  <body>
    <nav class="top-nav">
      <a href="{{ url_for('index') }}">Home</a>
      <a class="active" href="{{ url_for('annotation_page') }}">Annotation</a>
      <a href="{{ url_for('training_page') }}">Training</a>
      <a href="{{ url_for('inference_page') }}">Inference</a>
    </nav>
    <div class="layout">
      <aside class="sidebar">
        <section class="panel">
          <div class="panel-header">
            <h2>Datasets</h2>
            <button id="refreshDatasetsBtn" class="ghost" type="button">Refresh</button>
          </div>
          <form id="datasetForm" class="stack">
            <input id="datasetName" type="text" placeholder="Dataset name" required>
            <textarea id="datasetDescription" placeholder="Dataset description"></textarea>
            <div class="split-grid">
              <label>Train<input id="splitTrain" type="number" min="0" max="1" step="0.1" value="0.8"></label>
              <label>Val<input id="splitVal" type="number" min="0" max="1" step="0.1" value="0.2"></label>
              <label>Test<input id="splitTest" type="number" min="0" max="1" step="0.1" value="0.0"></label>
            </div>
            <button type="submit">Create dataset</button>
          </form>
          <div id="datasetList" class="list"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Classes</h2>
            <span id="currentDatasetName" class="subtle">No dataset selected</span>
          </div>
          <form id="classForm" class="inline-form">
            <input id="className" type="text" placeholder="Class name">
            <input id="classColor" type="color" value="#00ff00">
            <button type="submit">Add</button>
          </form>
          <div id="classList" class="list compact"></div>
        </section>
      </aside>

      <main class="content">
        <section class="panel toolbar-panel">
          <div class="toolbar">
            <label class="file-button">
              <input id="imageInput" type="file" multiple accept=".jpg,.jpeg,.png,.bmp,.webp">
              <span>Upload images</span>
            </label>
            <select id="classSelect"></select>
            <button id="prevImageBtn" class="ghost" type="button">Prev</button>
            <button id="nextImageBtn" class="ghost" type="button">Next</button>
            <button id="saveAnnotationsBtn" type="button">Save</button>
            <button id="clearAnnotationsBtn" class="ghost" type="button">Clear boxes</button>
            <button id="exportBtn" class="ghost" type="button">Export YOLO</button>
          </div>
          <div class="status-row">
            <div id="statusBar" class="status-bar">Ready</div>
            <div id="imageCounter" class="subtle">0 / 0</div>
          </div>
        </section>

        <section class="workspace">
          <div class="panel image-list-panel">
            <div class="panel-header">
              <h2>Images</h2>
            </div>
            <div id="imageList" class="image-list"></div>
          </div>

          <div class="panel canvas-panel">
            <div class="panel-header">
              <h2>Canvas</h2>
              <div class="hint">Drag to create. Click a box to select. Drag selected box to move. Drag handle to resize. Delete removes the selected box.</div>
            </div>
            <div class="canvas-wrap">
              <canvas id="annotationCanvas" width="960" height="640"></canvas>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='annotation.js') }}"></script>
  </body>
</html>
